# ============================================================
# 开发形态基础设施编排（只起中间件，不起应用）：
#   MySQL 8.4  -> 宿主 3307（避开本机已占用的 3306）
#   Redis 7    -> 宿主 6380
#   pgvector   -> 宿主 5432（PostgreSQL 16 + pgvector 扩展）
# 用法：docker compose -f deploy/docker-compose.dev.yml up -d
# ============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: travelagent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: travel
      MYSQL_USER: travel
      MYSQL_PASSWORD: travel
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [ "mysql-data:/var/lib/mysql" ]
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: travelagent-redis
    command: redis-server --appendonly yes
    volumes: [ "redis-data:/data" ]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: travelagent-pgvector
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelvec
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travelvec"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  redis-data:
  pg-data:
